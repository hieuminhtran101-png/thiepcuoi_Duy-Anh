<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp cưới Duy Anh &amp; Diệu Linh</title>
<meta name="description" content="Trân trọng kính mời bạn đến dự lễ thành hôn của Duy Anh &amp; Diệu Linh, Chủ nhật 18/10/2026.">
<meta name="theme-color" content="#5a1022">
<meta property="og:type" content="website">
<meta property="og:title" content="Thiệp mời cưới Duy Anh &amp; Diệu Linh">
<meta property="og:description" content="Trân trọng kính mời bạn đến dự lễ thành hôn của chúng tôi, Chủ nhật 18/10/2026.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== STYLE: dùng biến từ TOKENS & MOTION (xem phần script) ===== */
:root{--tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .22 0 0 0 0 .12 0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--wine-deep);color:var(--ink);font:20px/1.7 var(--font-body)}
body.lock{overflow:hidden}
img{max-width:100%}
.script{font-family:var(--font-script);font-weight:400}
.ico{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.15em}
section{position:relative;padding:92px 22px;text-align:center;overflow:hidden}
.paper{background:var(--ivory) var(--tex);color:var(--ink)}
.wine{background:var(--wine) var(--tex);color:var(--ivory)}
.wrap{max-width:660px;margin:0 auto;position:relative;z-index:1}
.sub{font-family:var(--font-script);font-size:34px;color:var(--gold);line-height:1.2;margin:0}
.wine .sub{color:var(--gold-light)}
h2{font-weight:500;font-size:clamp(30px,8vw,42px);line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 34px;color:var(--gold);width:min(260px,70%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{transform:scaleX(-1)}.orn i{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
p{margin:0 0 14px}.soft{opacity:.8}

/* scroll reveal (nhẹ) */
.rv{opacity:0;transform:translateY(22px);transition:opacity var(--reveal-ms) ease,transform var(--reveal-ms) cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* hoa lá */
.botw{position:absolute;width:clamp(42px,12vw,70px);pointer-events:none;z-index:0;transform-origin:50% 100%}
.botw.tl{left:-4px;top:-4px;transform:translate(-50%,-100%) rotate(138deg)}
.botw.tr{right:-4px;top:-4px;transform:translate(50%,-100%) rotate(-138deg)}
.botw.bl{left:-4px;bottom:-4px;transform:translate(-50%,0) rotate(42deg)}
.botw.br{right:-4px;bottom:-4px;transform:translate(50%,0) rotate(-42deg)}
.bot{display:block;width:100%;height:auto;opacity:.92;filter:drop-shadow(0 4px 6px rgba(30,4,10,.3));animation:float var(--float-dur) ease-in-out infinite;transform-origin:50% 100%}
.botw.tr .bot{animation-delay:-2s}.botw.bl .bot{animation-delay:-4s}.botw.br .bot{animation-delay:-1s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(calc(var(--float-dist)*-1)) rotate(1.6deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,147,74,.55)}70%,100%{box-shadow:0 0 0 14px rgba(184,147,74,0)}}
.bnc{display:inline-block;animation:bounce var(--bounce-dur) ease-in-out infinite}

/* ===== PHONG BÌ ===== */
.gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;overflow:hidden;
 background:linear-gradient(135deg,#7a1219,#4d0b13 55%,#36080e);color:var(--ivory);text-align:center;transition:opacity 1s ease}
.gate::before{content:"";position:absolute;inset:0;background:var(--tex);opacity:.7;pointer-events:none}
.gate.gone{opacity:0;pointer-events:none}
.gate .sub{color:var(--gold-light);font-size:38px;position:relative}
.gate-hint{font-style:italic;font-size:19px;color:var(--gold-light);position:relative;margin-top:30px;transition:opacity .4s}
.is-open .gate-hint{opacity:0}
.env{position:relative;width:min(86vw,380px);aspect-ratio:4/3;margin-top:120px;perspective:1100px;z-index:1}
.e{position:absolute;inset:0}
.e-back{background:#3a0913;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.e-left{background:linear-gradient(100deg,#6d1a2e,#5a1022);clip-path:polygon(0 0,54% 54%,0 100%);z-index:3}
.e-right{background:linear-gradient(260deg,#6d1a2e,#5a1022);clip-path:polygon(100% 0,46% 54%,100% 100%);z-index:3}
.e-bottom{background:linear-gradient(0deg,#4d0d1c,#6a1829);clip-path:polygon(0 100%,50% 40%,100% 100%);z-index:4}
.e-flap{background:linear-gradient(180deg,#85253a,#641427);clip-path:polygon(0 0,100% 0,50% 62%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.5,0,.2,1) .45s,z-index 0s .9s;z-index:6;height:100%}
.is-open .e-flap{transform:rotateX(180deg);z-index:1}
.e-letter{position:absolute;left:5%;right:5%;top:7%;bottom:3%;z-index:2;background:var(--ivory) var(--tex);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 12px 0;
 box-shadow:0 2px 10px rgba(0,0,0,.3);transition:transform 1.2s cubic-bezier(.3,.75,.2,1) 1.15s}
.is-open .e-letter{transform:translateY(-80%)}
.lt-photo{width:78%;flex:1;min-height:0;border:1px solid var(--gold);border-radius:999px 999px 0 0;padding:4px;overflow:hidden;margin-top:2px}
.lt-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:999px 999px 0 0;filter:sepia(.7) brightness(.75);transition:filter 1.8s ease 1.9s}
.is-open .lt-photo img{filter:none}
.lt-n{font-size:26px;color:var(--wine);line-height:1.1;flex:none}
.seal{position:absolute;left:50%;top:56%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:8;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;animation:pulse var(--pulse-dur) ease-out infinite;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
.seal svg{width:100%;height:100%;display:block;transition:transform .35s ease}
.seal:hover svg{transform:scale(1.06) rotate(-4deg)}
.is-open .seal{animation:crack .7s ease forwards;pointer-events:none}
@keyframes crack{30%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(.6) translateY(30px) rotate(-14deg);opacity:0}}
.seal:focus-visible,.btn:focus-visible,.chip input:focus-visible+span,input:focus-visible,select:focus-visible,textarea:focus-visible,.ph:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ===== BÌA THIỆP ===== */
.hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hearts i{position:absolute;bottom:-6%;font-style:normal;animation:heartUp linear infinite}
@keyframes heartUp{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(16px,-55vh) rotate(8deg)}100%{transform:translate(-10px,-112vh) rotate(-6deg)}}
.cover{position:relative;z-index:1;width:min(92vw,600px);animation:coverIn .9s cubic-bezier(.2,.7,.2,1) both}
.cv-card{position:relative;background:#f6ecea;color:#6b1220;border-radius:6px;padding:34px 22px 38px;box-shadow:0 30px 60px rgba(0,0,0,.45);text-align:center;overflow:hidden}
@keyframes coverIn{from{opacity:0;transform:translateY(16px)}}
.cv-card>*:not(.fl){position:relative}
.fl{position:absolute;width:210px;pointer-events:none;color:#b5707b;opacity:.8;fill:none;stroke:currentColor;stroke-width:1.2}
.fl.a{top:-4px;left:-4px}.fl.b{bottom:-4px;right:-4px;transform:rotate(180deg)}
.badge{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(145deg,#8a1c2c,#4d0b16);display:grid;place-items:center;box-shadow:0 8px 18px rgba(77,11,22,.4);animation:bounce var(--bounce-dur) ease-in-out infinite}
.badge .ico{font-size:26px;fill:#fff;stroke:#fff;color:#fff}
.cv-names{font-weight:600;font-size:clamp(34px,9vw,44px);line-height:1.15;margin:0}
.cv-names span{display:block;font-size:17px;font-weight:500;line-height:1.4}
.cv-div{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto;width:150px;color:#b5707b;font-size:10px}
.cv-div i{flex:1;height:1px;background:currentColor}
.cv-date{font-size:21px;margin:8px 0 22px}.cv-k{font-size:22px;margin:0 0 10px}
.chip2{display:inline-block;background:#ecd5d6;font-weight:600;padding:6px 18px;border-radius:12px;margin-bottom:10px;font-size:20px}
.cover p.t{margin:0;font-size:19px}
.cv-btn{font:inherit;font-weight:600;font-size:22px;color:#fff;background:linear-gradient(90deg,#8a1c2c,#5e0e1d);border:0;border-radius:999px;padding:12px 40px;margin-top:18px;cursor:pointer;animation:pulse var(--pulse-dur) ease-out infinite;transition:transform .3s}
.cv-btn:hover{transform:translateY(-2px)}.cv-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.envwrap{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;animation:coverIn .9s ease both}
.ef{position:absolute;width:clamp(120px,34vw,220px);bottom:2%;pointer-events:none;z-index:0}
.ef.l{left:-5%}.ef.r{right:-5%;transform:scaleX(-1)}

.cover.doors{animation:none;perspective:1500px}
.cover.doors .half{backface-visibility:hidden;pointer-events:none}
.cover.doors .half.l{clip-path:inset(0 50% 0 0);transform-origin:0 50%;animation:doorL 1s cubic-bezier(.65,0,.3,1) .1s forwards}
.cover.doors .half.r{position:absolute;inset:0;clip-path:inset(0 0 0 50%);transform-origin:100% 50%;animation:doorR 1s cubic-bezier(.65,0,.3,1) .1s forwards}
@keyframes doorL{to{transform:rotateY(104deg)}}@keyframes doorR{to{transform:rotateY(-104deg)}}
.glow{position:absolute;left:50%;top:50%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,226,170,.95),rgba(255,226,170,0) 66%);transform:translate(-50%,-50%) scale(.3);opacity:0;animation:glow 1.3s ease .2s forwards;pointer-events:none}
@keyframes glow{40%{opacity:1}to{opacity:.55;transform:translate(-50%,-50%) scale(1.5)}}
.burst{position:absolute;left:50%;top:50%;z-index:5;pointer-events:none}
.burst i{position:absolute;left:0;top:0;font-style:normal;color:var(--gold-light);font-size:var(--s);animation:burst 1.3s cubic-bezier(.2,.7,.3,1) .3s both}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(80deg);opacity:0}}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.petal{position:absolute;top:-30px;border-radius:70% 0 70% 0;animation:petalFall linear infinite;will-change:transform}
@keyframes petalFall{0%{transform:translate3d(0,-30px,0) rotate(0)}25%{transform:translate3d(26px,28vh,0) rotate(120deg)}50%{transform:translate3d(-18px,56vh,0) rotate(250deg)}75%{transform:translate3d(24px,86vh,0) rotate(380deg)}100%{transform:translate3d(-10px,118vh,0) rotate(520deg)}}

@media(max-height:680px){
 .gate{padding:14px}.cv-card{padding:20px 16px 24px}.badge{width:44px;height:44px;margin-bottom:8px}.badge .ico{font-size:22px}
 .cv-names{font-size:clamp(26px,8vw,32px)}.cv-div{margin:8px auto}.cv-date{font-size:19px;margin:4px 0 12px}.cv-k{font-size:19px;margin-bottom:6px}
 .chip2{font-size:17px;padding:4px 14px;margin-bottom:6px}.cover p.t{font-size:16px}.cv-btn{font-size:19px;padding:9px 32px;margin-top:12px}
 .fl{width:150px}
}
@media(max-width:340px){section{padding:76px 16px}.evc{padding:28px 14px 24px}.gc{padding:24px 14px}.gc .no{font-size:25px;letter-spacing:.08em}.ls{padding:70px 16px 80px}}
html{-webkit-text-size-adjust:100%}button,a,.ph{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ===== HERO ===== */
.hero{min-height:100vh;min-height:100svh;padding:72px 18px 0;display:flex;flex-direction:column;align-items:center;background:var(--ivory) var(--tex);color:var(--ink)}
.hero>*:not(.botw):not(.bld):not(.petals){position:relative;z-index:1}
.names{font-size:clamp(56px,15vw,96px);line-height:1.05;margin:4px 0 0;color:var(--gold-light)}
.names small{display:block;font-size:.42em;color:var(--ivory);opacity:.85;line-height:1.2}
.hdate{font-size:21px;letter-spacing:.2em;margin:10px 0 28px}
.archw{width:min(80vw,400px);aspect-ratio:2/3;border:1px solid var(--gold);border-radius:999px 999px 0 0;padding:8px 8px 0;margin-top:auto;position:relative}
.archw::after{content:"";position:absolute;inset:-9px -9px 0;border:1px solid rgba(227,201,139,.35);border-radius:999px 999px 0 0;pointer-events:none}
.archw .in{width:100%;height:100%;border-radius:999px 999px 0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#9a3148,transparent 70%);display:flex;align-items:flex-end}
.archw img{display:block;width:100%;height:auto}
.hero .rl{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both}
.hero .d2{animation-delay:.25s}.hero .d3{animation-delay:.5s}.hero .d4{animation-delay:3.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.hero .rl:not(.live){animation-play-state:paused}

.hero{padding-top:46px}
.hero .names{color:var(--wine)}.hero .names small{color:var(--ink)}
.hero .hdate{color:var(--wine);margin:8px 0 18px}
.std{font-style:italic;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(26px,7.5vw,36px);color:var(--wine);margin:0;line-height:1.2}
.scrollh{font-size:30px;color:var(--wine);margin:10px 0 24px;line-height:1}

/* ===== ALBUM 3D NỔI KHỐI ===== */
.ls{position:relative;overflow:hidden;background:#2a0710;color:#fff;padding:78px 20px 92px;text-align:left}
.ls-bg{position:absolute;left:-6%;top:-6%;width:112%;height:112%;object-fit:cover;filter:blur(24px) saturate(1.2) brightness(.55);animation:kb 26s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,1%)}}
.ls::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,6,14,.25),rgba(40,6,14,.5));pointer-events:none}
.ls-in{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.ls-mast{font-weight:700;font-size:clamp(24px,6vw,34px);letter-spacing:-.01em;text-transform:uppercase;margin:0 0 24px;opacity:0;transition:opacity 1.1s ease .1s}
.ls.in .ls-mast{opacity:1}
.ls-grid{display:grid;gap:34px;align-items:center}
.ls-stage{perspective:1300px}
.ls-card{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:3/2;box-shadow:0 34px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4);transform:rotateY(-26deg) rotateX(6deg) translateX(-40px) scale(.92);opacity:0;transform-origin:30% 50%;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1s ease}
.ls.in .ls-card{transform:rotateY(-7deg) rotateX(2deg);opacity:1;animation:cardFloat 7s ease-in-out 1.8s infinite}
@keyframes cardFloat{0%,100%{transform:rotateY(-7deg) rotateX(2deg) translateY(0)}50%{transform:rotateY(-4deg) rotateX(1deg) translateY(-8px)}}
.ls-card img{display:block;width:100%;height:100%;object-fit:cover}
.ls-sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.24) 50%,transparent 65%);transform:translateX(-120%)}
.ls.in .ls-sheen{animation:sheen 2.2s ease 1.2s 1 forwards}
@keyframes sheen{to{transform:translateX(120%)}}
.ls-txt p{margin:0}
.ls-txt>*{font-family:var(--font-sans);font-weight:600;opacity:0;transform:translateX(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.ls.in .ls-txt>*{opacity:1;transform:none}
.ls-txt>.s1{transition-delay:.5s}.ls-txt>.s2{transition-delay:.7s}.ls-txt>.s3{transition-delay:.9s}.ls-txt>.s4{transition-delay:1.1s}.ls-txt>.s5{transition-delay:1.4s}
.ls-k{font-size:14px;letter-spacing:.06em}
.ls-l{font-size:clamp(16px,4.4vw,22px);letter-spacing:.26em;text-transform:uppercase;margin:6px 0 2px!important;line-height:1.5}
.ls-t{font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:22px!important}
.ls-big{border-left:2px solid #fff;padding-left:16px;font-size:clamp(38px,11vw,62px);letter-spacing:.12em;line-height:1.28;margin-bottom:14px}
.ls-big span{display:block}
.ls-big2{font-size:clamp(30px,8.5vw,48px);letter-spacing:.12em;line-height:1.2}
@media(min-width:900px){.ls{padding:96px 40px}.ls-grid{grid-template-columns:1.35fr 1fr;gap:56px}}

.bld{position:absolute;left:50%;bottom:-1%;width:min(135vw,860px);height:auto;transform:translateX(-50%);opacity:.34;mix-blend-mode:multiply;pointer-events:none}
.scene2{width:min(92vw,430px);margin:6px auto 0}
.scene2>svg{display:block;width:100%;height:auto;overflow:visible}
.sc-closed,.sc-liner{transform-origin:200px 270px}
.sc-liner{transform:scaleY(0)}
.photo-in{transform:translateY(270px)}
.flw{opacity:0;transform-origin:50px 357px}
.sc-seal{filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.live .sc-closed{animation:flapShut .5s ease-in .5s forwards}
.live .sc-liner{animation:flapOpen .8s cubic-bezier(.3,.7,.3,1) 1s forwards}
.live .photo-in{animation:photoUp 1.7s cubic-bezier(.22,.85,.25,1) 1.7s forwards}
.live .flw{animation:flBloom 1.8s cubic-bezier(.2,.8,.3,1) 2.8s forwards}
.live .flw-s{animation:sway 8s ease-in-out 4.6s infinite;transform-origin:50px 357px}
.live .ph-sway{animation:phSway 7s ease-in-out 3.5s infinite;transform-origin:0 0}
@keyframes flapShut{to{transform:scaleY(0);opacity:0}}
@keyframes flapOpen{from{transform:scaleY(0)}to{transform:scaleY(-1)}}
@keyframes photoUp{to{transform:translateY(0)}}
@keyframes flBloom{from{opacity:0;transform:scale(.82) translateY(18px)}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.4deg)}}
@keyframes phSway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.1deg)}}
.sc-closed,.sc-liner,.photo-in,.flw{will-change:transform}

.dt-t{letter-spacing:.2em;font-size:21px;margin:0 0 2px}
.dt{display:flex;align-items:center;justify-content:center;gap:clamp(12px,5vw,28px);margin:4px 0}
.dt span{font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.dt b{font-weight:400;font-size:clamp(76px,22vw,108px);line-height:1;color:var(--gold-light)}
.lunar{font-style:italic;opacity:.85}
.cal{margin:30px auto 0;max-width:420px;background:rgba(255,255,255,.07);border:1px solid rgba(227,201,139,.35);border-radius:20px;padding:18px 10px 14px}
.cal-h{font-size:22px;letter-spacing:.06em;margin-bottom:10px;color:var(--gold-light)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;justify-items:center;align-items:center}
.cal-w{font-size:15px;opacity:.65}
.cal-d{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-size:19px}
.cal-d b{font-weight:500;position:relative;z-index:1}
.cal-d.ps{opacity:.3}.cal-d.td{box-shadow:0 0 0 1px var(--gold-light)}
.cal-d u{position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold-light)}
.hrt{position:absolute;inset:-9px;display:grid;place-items:center;font-style:normal;font-size:50px;line-height:1;color:#d2475f;animation:hbeat var(--pulse-dur) ease-in-out infinite;z-index:0}
.cal-d.wd b{color:#fff}
@keyframes hbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.cal-l{font-size:15px;opacity:.75;margin:12px 0 0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold-light);vertical-align:middle}
.ev{margin-top:26px}

/* ===== NỘI DUNG ===== */
.fam{display:grid;gap:34px;margin-top:8px}
.fam h3{font-family:var(--font-script);font-size:32px;color:var(--wine);margin:0}
.fam p{margin:0;font-size:21px}.fam small{display:block;opacity:.7;font-size:17px;font-style:italic;margin-top:6px}
.ev{display:grid;gap:18px;margin-top:6px}
.evc{border:1px solid rgba(227,201,139,.55);padding:34px 22px 28px;position:relative;background:rgba(58,9,19,.35)}
.evc::before{content:"";position:absolute;inset:6px;border:1px solid rgba(227,201,139,.2);pointer-events:none}
.evc .ico{font-size:34px;color:var(--gold-light)}
.evc h3{font-size:28px;font-weight:500;margin:6px 0 0}
.evc .t{font-size:42px;line-height:1.2;color:var(--gold-light)}
.evc address{font-style:normal;opacity:.85;font-size:18px;line-height:1.5}
.bigdate{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,30px);margin:6px 0 4px}
.bigdate b{font-weight:400;font-size:clamp(70px,20vw,104px);line-height:1;color:var(--wine)}
.bigdate div{font-size:20px;letter-spacing:.14em;line-height:1.4;border-left:1px solid var(--gold);border-right:1px solid var(--gold);padding:2px clamp(14px,5vw,30px)}
.count{display:flex;justify-content:center;gap:clamp(12px,5vw,34px);margin-top:26px}
.count b{display:block;font-weight:400;font-size:clamp(38px,11vw,56px);line-height:1;color:var(--wine)}
.count span{font-size:16px;letter-spacing:.1em;opacity:.75}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ph{border:0;padding:10px;background:var(--ivory) var(--tex);box-shadow:0 10px 24px rgba(58,9,19,.28);cursor:zoom-in;transition:transform .5s ease;display:block;width:100%}
.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 25%}
.ph:nth-child(1){grid-column:1/3;transform:rotate(-.8deg)}.ph:nth-child(1) img{aspect-ratio:4/3.2;object-position:50% 22%}
.ph:nth-child(2){transform:rotate(1.2deg)}.ph:nth-child(3){transform:rotate(-1deg)}
.ph:hover{transform:rotate(0) scale(1.015)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(30,4,10,.94);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-height:90vh;border:8px solid var(--ivory)}
.map{border:1px solid var(--gold);padding:8px;background:var(--ivory)}
.map svg{display:block;width:100%;height:auto}
.pin{transform-origin:50% 100%;animation:bounce var(--bounce-dur) ease-in-out infinite}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:19px;letter-spacing:.06em;color:var(--ivory);background:var(--wine);border:1px solid var(--gold);padding:13px 30px;cursor:pointer;text-decoration:none;animation:pulse var(--pulse-dur) ease-out infinite;transition:background .3s,transform .3s}
.btn:hover{background:var(--wine-soft);transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--wine);animation:none}
.wine .btn{background:var(--ivory);color:var(--wine)}
form{text-align:left;display:grid;gap:18px}
label,.lbl{display:block;font-size:18px;margin-bottom:4px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:19px;padding:12px 14px;border:1px solid var(--gold);background:rgba(255,252,244,.8);color:var(--ink);border-radius:0}
.chips{display:flex;gap:10px}.chip{flex:1;position:relative}.chip input{position:absolute;opacity:0}
.chip span{display:block;text-align:center;padding:12px 6px;border:1px solid var(--gold);cursor:pointer;transition:background .25s,color .25s}
.chip input:checked+span{background:var(--wine);color:var(--ivory)}
.err{color:#8c1d2b;font-size:17px;min-height:22px;margin:0}
.thx{padding:38px 20px;border:1px solid var(--gold);font-size:24px}
.thx .ico{font-size:40px;color:var(--wine)}
.gifts{display:grid;gap:18px}
.gc{border:1px solid rgba(227,201,139,.55);padding:30px 20px;background:rgba(58,9,19,.35)}
.gc .ico{font-size:32px;color:var(--gold-light)}
.gc h3{font-size:25px;font-weight:500;margin:4px 0 8px}
.gc .no{font-size:30px;letter-spacing:.12em;color:var(--gold-light);margin:6px 0}
.gc p{margin:0;opacity:.85}
footer{background:var(--wine-deep) var(--tex);color:var(--ivory);text-align:center;padding:70px 22px 90px;position:relative;overflow:hidden}
footer .script{font-size:clamp(46px,13vw,72px);color:var(--gold-light);line-height:1.1}
#mus{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;width:42px;height:42px;padding:8px;border-radius:50%;border:1px solid var(--gold);background:var(--wine);color:var(--gold-light);cursor:pointer}#mus svg{width:100%;height:100%;display:block}
#mus.on{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:720px){.fam,.ev,.gifts{grid-template-columns:1fr 1fr}.fam{gap:50px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.hearts{display:none}.petals,.burst{display:none}.sc-closed{display:none}.sc-liner{transform:scaleY(-1)}.photo-in{transform:none}.flw{opacity:1}}
</style></head>

/* ================= 2. TOKENS — màu & phông chữ ================= */
const TOKENS={
  "--wine":"#5a1022","--wine-deep":"#36081a","--wine-soft":"#7c1d33",
  "--ivory":"#f7eedd","--gold":"#b8934a","--gold-light":"#e3c98b",
  "--blush":"#d9a7ac","--leaf":"#6d7a58","--ink":"#3a1a20",
  "--font-body":'"Cormorant Garamond","Times New Roman",serif',
  "--font-script":'"Great Vibes","Snell Roundhand",cursive',
  "--font-sans":'"Montserrat","Be Vietnam Pro",Arial,sans-serif'
};

/* ================= 3. MOTION — cài đặt chuyển động ================= */
const MOTION={floatDur:"8s",floatDist:"7px",bounceDur:"2.8s",pulseDur:"2.8s",revealMs:900,openMs:3600,reveal:true};

const C=CONTENT, IMG=C.images;

/* ================= 4. COMPONENTS ================= */
function Reveal({children,delay=0}){
  const ref=useRef(null),[on,setOn]=useState(!MOTION.reveal||REDUCED);
  useEffect(()=>{ if(on)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setOn(true);io.disconnect()}},{threshold:.12});
    io.observe(ref.current);return()=>io.disconnect()},[]);
  return html`<div ref=${ref} className=${"rv"+(on?" in":"")} style=${{transitionDelay:delay+"ms"}}>${children}</div>`;
}
function Icon({n}){
  const P={
    cal:'<rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10C19.5 15.4 12 20 12 20Z"/>',
    pin:'<path d="M12 21s6.5-6.1 6.5-11A6.5 6.5 0 0 0 5.5 10c0 4.9 6.5 11 6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>',
    gift:'<rect x="4" y="9" width="16" height="11" rx="1"/><path d="M3 9h18V6H3zM12 6v14M12 6C10.5 3 7 3 7.5 5.500M12 6c1.500-3 5-3 4.500-.5"/>',
    clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'};
  return html`<svg className="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html:P[n]}}/>`;
}
function Botanical(){return html`<img className="bot" src=${IMG.flower} alt="" aria-hidden="true"/>`}
function Corners({pos=["tl","tr"]}){return pos.map(p=>html`<div key=${p} className=${"botw "+p}><${Botanical}/></div>`)}
function Title({sub,children}){
  return html`<${Reveal}><p className="sub">${sub}</p><h2>${children}</h2><div className="orn"><i></i></div><//>`;
}
function Seal(p){
  const pts=Array.from({length:18},(_,i)=>{const a=i/18*6.2832,b=(i+.5)/18*6.2832;return [50+44*Math.cos(a),50+44*Math.sin(a),50+36*Math.cos(b),50+36*Math.sin(b)]});
  const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)+"Q"+p[2].toFixed(1)+" "+p[3].toFixed(1)).join(" ")+" ";
  return html`<svg viewBox="0 0 100 100" aria-hidden="true" ...${p}>
    <defs><radialGradient id="sg" cx=".35" cy=".3" r=".9"><stop offset="0" stopColor="#f1dca3"/><stop offset=".55" stopColor="#c9a257"/><stop offset="1" stopColor="#8a6a2c"/></radialGradient></defs>
    <circle cx="50" cy="50" r="46" fill="url(#sg)"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#6e5220" strokeWidth="1.2" opacity=".7"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#f5e4b1" strokeWidth=".8" opacity=".6"/>
    <path d="M50 68C33 56 27 45 33 37C39 31 47 33 50 41C53 33 61 31 67 37C73 45 67 56 50 68Z" fill="rgba(255,236,176,.35)" stroke="#6e5220" strokeWidth="2.6" strokeLinejoin="round"/>
  </svg>`;
}
function Hearts(){
  const hs=useRef(Array.from({length:18},(_,i)=>({l:(i*53+11)%96+2,s:10+(i*7)%16,d:15+(i*5)%12,dl:-((i*2.3)%15),o:.28+(i%4)*.12,c:i%3?"#d98a94":"#e5495b"}))).current;
  return html`<div className="hearts" aria-hidden="true">${hs.map((h,i)=>html`<i key=${i} style=${{left:h.l+"%",fontSize:h.s+"px",animationDuration:h.d+"s",animationDelay:h.dl+"s",opacity:h.o,color:h.c}}>♥</i>`)}</div>`;
}
function CoverBody({onOpen}){
  const FL=html`<path d="M4 100C-6 70 10 34 40 44C68 54 56 94 32 90C18 88 22 68 36 72M44 40C80 -6 140 32 206 4M78 56C72 40 92 34 96 46C100 60 82 68 78 56Z"/>`;
  return html`<div className="cv-card">
    <svg className="fl a" viewBox="0 0 210 150" aria-hidden="true">${FL}</svg>
    <svg className="fl b" viewBox="0 0 210 150" aria-hidden="true">${FL}</svg>
    <div className="badge"><${Icon} n="heart"/></div>
    <h1 className="cv-names">${C.groom}<span>&</span>${C.bride}</h1>
    <div className="cv-div"><i></i>♥<i></i></div>
    <p className="cv-date">${C.day} tháng ${C.month}, ${C.year}</p>
    <p className="cv-k">Kính mời</p>
    <p className="t">đến dự lễ thành hôn của chúng tôi<br/>tại gia đình nhà trai</p>
    <button className="cv-btn" onClick=${onOpen}>Mở thiệp</button>
  </div>`;
}
function Cover({onOpen,leaving}){
  if(!leaving)return html`<div className="cover"><${CoverBody} onOpen=${onOpen}/></div>`;
  const bits=Array.from({length:20},(_,i)=>{const a=i/20*6.283+(i%2)*.15,d=120+(i*37)%110;
    return {dx:Math.cos(a)*d,dy:Math.sin(a)*d*.8,s:11+(i*5)%11,h:i%3?"♥":"✦"}});
  return html`<div className="cover doors" aria-hidden="true">
    <div className="glow"></div>
    <div className="half l"><${CoverBody}/></div><div className="half r"><${CoverBody}/></div>
    <div className="burst">${bits.map((b,i)=>html`<i key=${i} style=${{"--dx":b.dx+"px","--dy":b.dy+"px","--s":b.s+"px"}}>${b.h}</i>`)}</div>
  </div>`;
}
function Gate({onOpen,gone}){
  const [leaving,setLeaving]=useState(false);
  const go=()=>{if(leaving)return;setLeaving(true);setTimeout(onOpen,REDUCED?50:1250)};
  return html`<div className=${"gate"+(gone?" gone":"")}><${Hearts}/><${Cover} onOpen=${go} leaving=${leaving}/></div>`;
}
function Scene({live}){
  const stop=(o,c)=>html`<stop offset=${o} stopColor=${c}/>`;
  return html`<div className=${"scene2"+(live?" live":"")}>
  <svg viewBox="-20 0 440 520" role="img" aria-label=${"Thiệp mời của "+C.groom+" và "+C.bride}>
    <defs>
      <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">${stop(0,"#3b0816")}${stop(1,"#4d0c1d")}</linearGradient>

      <filter id="psh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="5" floodColor="#1c0309" floodOpacity=".4"/></filter>
    <clipPath id="pclip"><rect x="-60" y="-100" width="520" height="566"/></clipPath>
    </defs>
    <rect x="30" y="270" width="340" height="210" fill="url(#gBack)" filter="url(#esh)"/>

}
function Petals(){
  const ps=useRef(Array.from({length:12},(_,i)=>({l:(i*83+9)%92+2,w:9+(i*5)%8,d:15+(i*7)%10,dl:3+i*.9,
    c:i%4===0?"linear-gradient(135deg,#f3e1c4,#d9b98c)":"linear-gradient(135deg,#c9576f,#7a1d33)",o:.55+(i%3)*.12}))).current;
  return html`<div className="petals" aria-hidden="true">${ps.map((p,i)=>html`<i key=${i} className="petal" style=${{left:p.l+"%",width:p.w+"px",height:(p.w*1.3)+"px",background:p.c,opacity:p.o,animationDuration:p.d+"s",animationDelay:p.dl+"s"}}></i>`)}</div>`;
}
function Hero({live}){
  const k=live?" live":"";
  return html`<section className="hero" id="top">
    <img className="bld" src=${IMG.castle} alt="" aria-hidden="true"/>

}
function Family(){
  return html`<section className="paper"><${Corners} pos=${["tl","br"]}/><div className="wrap">
    <${Title} sub="Trân trọng kính mời">Thư mời dự lễ cưới<//>
    <${Reveal}><p style=${{fontSize:"22px"}}>${C.intro}</p><//>
    <div className="fam" style=${{marginTop:"36px"}}>
      ${C.families.map((f,i)=>html`<${Reveal} key=${i} delay=${i*150}>
        <h3>${f.title}</h3><p>${f.father}</p><p>${f.mother}</p><small>${f.addr}</small><//>`)}
    </div></div></section>`;
}
function useCountdown(){
  const T=new Date(C.dateISO).getTime();
  const calc=()=>{const t=Math.max(0,T-Date.now());return [Math.floor(t/864e5),Math.floor(t%864e5/36e5),Math.floor(t%36e5/6e4),Math.floor(t%6e4/1e3)]};
  const [v,setV]=useState(calc);
  useEffect(()=>{const i=setInterval(()=>setV(calc()),1000);return()=>clearInterval(i)},[]);
  return v;
}
function Calendar(){
  const [Y,M,D]=C.dateISO.slice(0,10).split("-").map(Number),[now]=useState(()=>new Date());
  const lead=(new Date(Y,M-1,1).getDay()+6)%7,n=new Date(Y,M,0).getDate(),marks=C.marks||[];
  const cells=[...Array(lead).fill(0),...Array.from({length:n},(_,i)=>i+1)];
  const isT=d=>now.getFullYear()===Y&&now.getMonth()===M-1&&now.getDate()===d, past=d=>new Date(Y,M-1,d,23,59,59)<now;
  return html`<div className="cal" role="group" aria-label=${"Lịch tháng "+M+" năm "+Y}>
    <div className="cal-h">Tháng ${M} · ${Y}</div>
    <div className="cal-g">
      ${["T2","T3","T4","T5","T6","T7","CN"].map(w=>html`<span key=${w} className="cal-w">${w}</span>`)}
      ${cells.map((d,i)=>{if(!d)return html`<span key=${"e"+i}></span>`;
        const mk=marks.find(m=>m.d===d),cls="cal-d"+(d===D?" wd":"")+(isT(d)?" td":"")+(past(d)&&!isT(d)?" ps":"");
        return html`<span key=${d} className=${cls} title=${mk?mk.label:""}>${d===D&&html`<i className="hrt">♥</i>`}<b>${d}</b>${mk&&html`<u></u>`}</span>`})}
    </div>
    <p className="cal-l">♥ Ngày cưới${marks.map(m=>html`<span key=${m.d}> · <i className="dot"></i> ${m.label}</span>`)}</p>
  </div>`;
}
function Events(){
  const v=useCountdown(),lab=["ngày","giờ","phút","giây"];
  const st=new Date(C.dateISO),en=new Date(st.getTime()+3*36e5),f=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,"");
  const gcal="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Lễ thành hôn "+C.groom+" & "+C.bride)+"&dates="+f(st)+"/"+f(en)+"&location="+encodeURIComponent(C.venue.name+", "+C.venue.addr)+"&details="+encodeURIComponent("Trân trọng kính mời bạn đến dự.");
  return html`<section className="wine"><${Corners} pos=${["tr","bl"]}/><div className="wrap">
    <${Title} sub="Thông tin lễ cưới">Thời gian và địa điểm<//>
    <${Reveal}>
      <p className="dt-t">VÀO LÚC ${C.time}</p>
      <div className="dt"><span>${C.weekday}</span><b>${C.day}</b><span>Tháng ${C.month}</span></div>
      <p style=${{margin:"2px 0",letterSpacing:".14em"}}>NĂM ${C.year}</p>
      <p className="lunar">(${C.lunar})</p>
      <div className="count" role="timer">
        ${v.map((x,i)=>html`<div key=${i}><b style=${{color:"var(--gold-light)"}}>${i?String(x).padStart(2,"0"):x}</b><span>${lab[i]}</span></div>`)}
      </div>
    <//>
    <${Reveal}><${Calendar}/><//>
    <div className="ev">
      ${C.events.map((e,i)=>html`<${Reveal} key=${i} delay=${i*150}><div className="evc">
        <span className="bnc" style=${{animationDelay:(i*-1.2)+"s"}}><${Icon} n=${e.icon}/></span>
        <h3>${e.title}</h3><div className="t">${e.time}</div>
        <p style=${{margin:"0 0 2px"}}>${e.date}</p><p className="lunar" style=${{margin:"0 0 8px",fontSize:"17px"}}>${e.lunar}</p>
        <p style=${{margin:"0 0 2px"}}>${e.place}</p><address>${e.addr}</address></div><//>`)}
    </div>
    <${Reveal}><a className="btn" style=${{marginTop:"30px"}} href=${gcal} target="_blank" rel="noopener"><${Icon} n="cal"/> Thêm vào lịch</a><//>
  </div></section>`;
}
function LoveStory(){
  const S=C.story,ref=useRef(null),[on,setOn]=useState(REDUCED);
  useEffect(()=>{if(on)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setOn(true);io.disconnect()}},{threshold:.25});
    io.observe(ref.current);return()=>io.disconnect()},[]);
  return html`<section ref=${ref} className=${"ls"+(on?" in":"")} aria-label="Câu chuyện tình yêu">
    <img className="ls-bg" src=${IMG.p4} alt="" aria-hidden="true"/>
    <div className="ls-in">
      <p className="ls-mast">${S.mast}</p>
      <div className="ls-grid">
        <div className="ls-stage"><div className="ls-card"><img src=${IMG.p4} alt="Duy Anh và Diệu Linh dưới chiếc ô trong suốt"/><i className="ls-sheen"></i></div></div>
        <div className="ls-txt">
          <p className="ls-k s1">${S.kicker}</p><p className="ls-l s2">${S.names}</p><p className="ls-t s3">${S.tag}</p>
          <div className="ls-big s4"><span>${S.big[0]}</span><span>${S.big[1]}</span></div>
          <div className="ls-big2 s5">${S.big[2]}</div>
        </div>
      </div>
    </div>
  </section>`;
}
function Gallery(){
  const [sel,setSel]=useState(null), L=[IMG.p1,IMG.p2,IMG.p3];
  useEffect(()=>{const k=e=>e.key==="Escape"&&setSel(null);addEventListener("keydown",k);return()=>removeEventListener("keydown",k)},[]);
  return html`<section className="paper"><${Corners} pos=${["tl","tr"]}/><div className="wrap">
    <${Title} sub="Album cưới">Khoảnh khắc của chúng tôi<//>
    <${Reveal}><div className="gal">
      ${L.map((s,i)=>html`<button key=${i} className="ph" onClick=${()=>setSel(s)} aria-label=${"Xem ảnh "+(i+1)}><img src=${s} alt=${"Ảnh cưới "+(i+1)} loading="lazy"/></button>`)}
    </div><//></div>
    ${sel&&html`<div className="lb" role="dialog" aria-modal="true" onClick=${()=>setSel(null)}><img src=${sel} alt="Ảnh cưới phóng to"/></div>`}
  </section>`;
}
function MapCard(){
  const q=encodeURIComponent(C.venue.name+" "+C.venue.addr);
  return html`<section className="wine"><div className="wrap">
    <${Title} sub="Địa điểm">Chỉ đường đến lễ cưới<//>
    <${Reveal}><div className="map"><svg viewBox="0 0 400 240" role="img" aria-label="Bản đồ minh họa">
      <rect width="400" height="240" fill="#efe2c7"/>
      <path d="M-10 190C80 160 150 210 240 170S360 120 410 140V250H-10Z" fill="#c9d3c2" opacity=".7"/>
      <g stroke="#b8934a" strokeWidth="2" fill="none" opacity=".75"><path d="M0 70H400M0 150H400M90 0V240M250 0V240M170 0L330 240"/></g>
      <g stroke="#b8934a" strokeWidth="1" fill="none" opacity=".4"><path d="M0 110H400M40 0V240M320 0V240M0 30H400"/></g>
      <g className="pin"><path d="M200 112s26-24 26-44a26 26 0 0 0-52 0c0 20 26 44 26 44Z" fill="#5a1022" stroke="#e3c98b" strokeWidth="2"/><circle cx="200" cy="68" r="9" fill="#e3c98b"/></g>
      <ellipse cx="200" cy="116" rx="14" ry="4" fill="#3a1a20" opacity=".25"/>
    </svg></div>
    <p style=${{marginTop:"20px",fontSize:"22px"}}>${C.venue.name}</p><p className="soft">${C.venue.addr}</p>
    <a className="btn" href=${"https://www.google.com/maps/search/?api=1&query="+q} target="_blank" rel="noopener"><${Icon} n="pin"/> Chỉ đường</a><//>
  </div></section>`;
}
function Rsvp(){
  const [done,setDone]=useState(null),[err,setErr]=useState("");
  const submit=e=>{e.preventDefault();const f=new FormData(e.target),n=(f.get("name")||"").trim();
    if(!n){setErr("Vui lòng nhập họ và tên của bạn.");return}
    setErr("");setDone({n,yes:f.get("a")==="yes"})};
  return html`<section className="paper"><${Corners} pos=${["bl","tr"]}/><div className="wrap">
    <${Title} sub="Xác nhận tham dự">Bạn sẽ đến chứ?<//>
    <${Reveal}><p className="soft">Vui lòng xác nhận để gia đình chu đáo chuẩn bị.</p>
    ${done?html`<div className="thx"><span className="bnc"><${Icon} n="heart"/></span><p className="script" style=${{fontSize:"38px",margin:"6px 0",color:"var(--wine)"}}>Cảm ơn ${done.n}</p>
        <p>${done.yes?"Hẹn gặp bạn trong ngày vui của chúng tôi!":"Chúng tôi rất tiếc và sẽ nhớ đến bạn."}</p></div>`
    :html`<form onSubmit=${submit} noValidate>
      <div><label htmlFor="nm">Họ và tên</label><input type="text" id="nm" name="name" autoComplete="name"/></div>
      <div><span className="lbl">Bạn có tham dự không?</span><div className="chips">
        <label className="chip"><input type="radio" name="a" value="yes" defaultChecked/><span>Có, tôi sẽ đến</span></label>
        <label className="chip"><input type="radio" name="a" value="no"/><span>Rất tiếc, không thể</span></label></div></div>
      <div><label htmlFor="gs">Số người tham dự</label><select id="gs" name="guests">${[1,2,3,4,5].map(n=>html`<option key=${n} value=${n}>${n} người</option>`)}</select></div>
      <div><label htmlFor="ws">Lời chúc gửi đến cô dâu chú rể</label><textarea id="ws" name="wish" rows="3"></textarea></div>
      <p className="err" role="alert">${err}</p>
      <button className="btn" type="submit" style=${{justifyContent:"center"}}><${Icon} n="heart"/> Gửi xác nhận</button>
    </form>`}<//>
  </div></section>`;
}
function GiftCard({g}){
  const [ok,setOk]=useState(false);
  const copy=()=>{const f=()=>{setOk(true);setTimeout(()=>setOk(false),2000)};
    navigator.clipboard?navigator.clipboard.writeText(g.number).then(f,f):f()};
  return html`<div className="gc"><span className="bnc"><${Icon} n="gift"/></span><h3>${g.who}</h3>
    <p>${g.bank}</p><div className="no">${g.number}</div><p>${g.holder}</p>
    <button className="btn" style=${{marginTop:"18px"}} onClick=${copy}>${ok?"Đã sao chép":"Sao chép số tài khoản"}</button></div>`;
}
function Gift(){
  return html`<section className="wine"><${Corners} pos=${["tl","br"]}/><div className="wrap">
    <${Title} sub="Hộp mừng cưới">Gửi lời chúc phúc<//>
    <${Reveal}><p className="soft" style=${{marginBottom:"28px"}}>Sự hiện diện của bạn là món quà quý giá nhất. Nếu muốn gửi thêm lời chúc, bạn có thể dùng thông tin dưới đây.</p><//>
    <div className="gifts">${C.gifts.map((g,i)=>html`<${Reveal} key=${i} delay=${i*150}><${GiftCard} g=${g}/><//>`)}</div>
  </div></section>`;
}
function Footer(){
  return html`<footer><${Corners} pos=${["tl","tr"]}/><${Reveal}><div className="script">${C.groom} & ${C.bride}</div>
    <p className="soft">Trân trọng cảm ơn.</p><//></footer>`;
}
function Music(){
  const a=useRef(null),[on,setOn]=useState(false);
  useEffect(()=>{window.__bgm=()=>{a.current&&a.current.play().then(()=>setOn(true)).catch(()=>{})}},[]);
  if(!C.music)return null;
  const tg=()=>{const el=a.current;if(el.paused){el.play();setOn(true)}else{el.pause();setOn(false)}};
  return html`<div><audio ref=${a} src=${C.music} loop></audio><button id="mus" className=${on?"on":""} onClick=${tg} aria-label="Bật hoặc tắt nhạc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg></button></div>`;
}
function App(){
  const [opened,setOpened]=useState(false),[gone,setGone]=useState(false),[removed,setRemoved]=useState(false);
  useEffect(()=>{const r=document.documentElement.style;
    Object.entries(TOKENS).forEach(([k,v])=>r.setProperty(k,v));
    r.setProperty("--float-dur",MOTION.floatDur);r.setProperty("--float-dist",MOTION.floatDist);
    r.setProperty("--bounce-dur",MOTION.bounceDur);r.setProperty("--pulse-dur",MOTION.pulseDur);
    r.setProperty("--reveal-ms",MOTION.revealMs+"ms")},[]);
  const open=()=>{setOpened(true);setGone(true);document.body.classList.remove("lock");window.scrollTo(0,0);window.__bgm&&window.__bgm();setTimeout(()=>setRemoved(true),1100)};
  return html`<main><${Hero} live=${opened}/><${Family}/><${Events}/><${LoveStory}/><${Gallery}/><${MapCard}/><${Rsvp}/>${C.showGift&&html`<${Gift}/>`}<${Footer}/><${Music}/>
    ${!removed&&html`<${Gate} onOpen=${open} gone=${gone}/>`}</main>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
